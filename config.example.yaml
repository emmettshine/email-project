# Email Triage System Configuration
# Copy this file to config.yaml and fill in your account details

# ============================================================================
# AUTHENTICATION OPTIONS:
#
# 1. Gmail OAuth (Recommended for Gmail accounts)
#    - auth_type: oauth
#    - Requires credentials/google_oauth_credentials.json
#    - Run 'python main.py auth' to authenticate
#
# 2. IMAP with App Password (For Gmail or other providers)
#    - auth_type: imap (or omit, as this is the default)
#    - For Gmail: Generate App Password at https://myaccount.google.com/apppasswords
#    - Password can be set in config or via environment variable
# ============================================================================

accounts:
  # Example: Gmail account using OAuth (recommended)
  # gmail_account_index: Position in Gmail's account switcher (u/0, u/1, etc.)
  #   - Your primary Gmail account is usually u/0
  #   - Additional accounts are u/1, u/2, etc. based on sign-in order
  - name: "Personal"
    email: "you@gmail.com"
    auth_type: oauth  # Uses Gmail API with OAuth2
    gmail_account_index: 0  # u/0 - primary Gmail account

  # Example: Gmail account using IMAP with App Password
  - name: "Work Gmail"
    email: "you@company.com"
    auth_type: imap
    imap_server: "imap.gmail.com"
    imap_port: 993
    username: "you@company.com"
    # For Gmail, use an App Password: https://myaccount.google.com/apppasswords
    password: ""  # Or set WORK_GMAIL_EMAIL_PASSWORD env var

  # Example: Non-Gmail account using IMAP
  - name: "Work"
    email: "you@company.com"
    auth_type: imap
    imap_server: "imap.company.com"
    imap_port: 993
    username: "you@company.com"
    password: ""  # Or set WORK_EMAIL_PASSWORD env var

  # Example: Another OAuth Gmail account
  - name: "Side Project"
    email: "project@gmail.com"
    auth_type: oauth

  # OAuth account examples - use auth_type: "oauth" for OAuth authentication
  - name: "Gmail OAuth"
    email: "you@gmail.com"
    auth_type: "oauth"
    oauth_provider: "gmail"  # Automatically uses imap.gmail.com
    # Access token can be set here or via environment variable GMAIL_OAUTH_ACCESS_TOKEN
    access_token: ""

  - name: "Outlook OAuth"
    email: "you@outlook.com"
    auth_type: "oauth"
    oauth_provider: "outlook"  # Automatically uses outlook.office365.com
    # Access token can be set here or via environment variable OUTLOOK_OAUTH_ACCESS_TOKEN
    access_token: ""

# Triage rules - emails matching these rules get categorized
triage_rules:
  urgent:
    - from_contains: ["boss@", "ceo@", "urgent@"]
    - subject_contains: ["URGENT", "ASAP", "emergency"]

  important:
    - from_contains: ["client", "customer"]
    - subject_contains: ["invoice", "payment", "contract"]

  newsletters:
    - from_contains: ["newsletter", "noreply", "marketing"]
    - subject_contains: ["unsubscribe", "weekly digest"]

  low_priority:
    - from_contains: ["notifications@", "alerts@"]
    - subject_contains: ["automated", "notification"]

# Display settings
display:
  max_emails_per_account: 50
  show_preview_length: 100
  date_format: "%Y-%m-%d %H:%M"

# Slack integration settings
# To get a Bot Token, create a Slack app at https://api.slack.com/apps
# Required scopes: chat:write, channels:read, groups:read
slack:
  # Bot User OAuth Token (starts with xoxb-)
  # Can also be set via SLACK_BOT_TOKEN environment variable
  bot_token: ""
  # Default channel for posting digests (include # prefix)
  channel: "#email-digests"
  # Include email preview text in digest
  include_preview: false
  # Maximum emails to show per priority level
  max_emails_per_priority: 5
